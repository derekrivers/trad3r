[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trad3r"
version = "0.1.0"
description = "Offline trading research and deterministic market-data replay"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
trad3r = "trad3r.__main__:main"

[tool.setuptools.packages.find]
include = ["trad3r*"]
